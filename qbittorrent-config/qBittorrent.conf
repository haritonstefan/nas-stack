# Seeded by nas install into the qBittorrent config dir only if not already present,
# so edits made on the NAS survive re-runs. Edit it there, not here, once
# running — qBittorrent rewrites this file on clean shutdown, which makes this a
# first-boot seed rather than ongoing config management.
#
# nas install substitutes __WEBUI_PORT__, __WEBUI_USER__, __PASSWORD_PBKDF2__,
# __SAVE_PATH__, __TEMP_PATH__, __SEED_RATIO__ and __SEED_MINUTES__ at
# install time.
#
# Pre-seeding the password is not cosmetic: with none stored, qBittorrent mints
# a new random one on EVERY start and logs it, which would invalidate the
# credentials Sonarr and Radarr hold on every restart.

[BitTorrent]
Session\DefaultSavePath=__SAVE_PATH__
Session\TempPath=__TEMP_PATH__
Session\TempPathEnabled=true
Session\TorrentContentLayout=Original

Session\GlobalMaxRatio=__SEED_RATIO__
Session\GlobalMaxSeedingMinutes=__SEED_MINUTES__
# Deletion at the cap is the arr apps' job; this stop is only the trigger (the
# pairing is in spec section 8). Must be the enum's string NAME, not its
# integer: qBittorrent serialises enums via Utils::String::fromEnum, and a
# numeric value silently falls back to the default.
Session\ShareLimitAction=Stop

[Preferences]
WebUI\Port=__WEBUI_PORT__
WebUI\Username=__WEBUI_USER__
WebUI\Password_PBKDF2="@ByteArray(__PASSWORD_PBKDF2__)"
# Sonarr, Radarr and Homepage reach the WebUI by container name over nas-net,
# which fails host-header validation and has no browser session to carry a CSRF
# token. LAN-only box, no forwarded ports. See spec section 8.
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=false
