services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-apollo.local}
      TZ: ${TZ:-Europe/Bucharest}
    # Identity is set here rather than via the image's PUID/PGID, so it is
    # visible to `docker inspect` instead of decided inside the entrypoint.
    # The primary GID is the host `docker` group, which owns the 0660 socket
    # Homepage reads container labels from — a primary GID cannot be dropped
    # during privilege transition, and it needs no DAC_OVERRIDE to open the
    # socket. /app/config is owned by PUID, so it stays writable.
    user: "${PUID:-1000}:${DOCKER_GID:-121}"
    ports:
      - "${HOMEPAGE_HTTP_PORT:-80}:3000"
    volumes:
      - ${HOMEPAGE_CONFIG_DIR:-/volume2/docker/homepage/config}:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Core
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=http://apollo.local/
      - homepage.description=Service dashboard

networks:
  nas-net:
    name: nas-net
