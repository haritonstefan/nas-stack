services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-apollo.local}
      TZ: ${TZ:-Europe/Bucharest}
    # Not the image's PUID/PGID: identity must be inspectable, and the primary
    # GID must be the host docker group that owns the 0660 socket label
    # discovery reads. A primary GID survives any privilege drop.
    user: "${PUID:-1000}:${DOCKER_GID:-121}"
    ports:
      - "${HOMEPAGE_HTTP_PORT:-80}:3000"
    volumes:
      - ${HOMEPAGE_CONFIG_DIR:-/volume2/docker/homepage/config}:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Core
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=http://apollo.local/
      - homepage.description=Service dashboard

networks:
  nas-net:
    name: nas-net
