services:
  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=nas-net
      - --entrypoints.web.address=:80
      - --entrypoints.dashboard.address=:8080
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=INFO
      - --accesslog=true
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8082}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/`)
      - traefik.http.routers.traefik-dashboard.entrypoints=dashboard
      - traefik.http.routers.traefik-dashboard.service=api@internal

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-apollo.local}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - ${HOMEPAGE_CONFIG_DIR:-/volume2/docker/homepage/config}:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=PathPrefix(`/`)
      - traefik.http.routers.homepage.entrypoints=web
      - traefik.http.routers.homepage.priority=1
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - homepage.group=Core
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=http://apollo.local/
      - homepage.description=Service dashboard

networks:
  nas-net:
    name: nas-net
