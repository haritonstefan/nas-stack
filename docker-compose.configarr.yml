services:
  # TRaSH quality profiles and custom formats for Sonarr and Radarr. Run to
  # completion, not a daemon: the ofelia unit starts it on a schedule.
  #
  # `profiles:` keeps it out of a plain `up -d` — with no depends_on between
  # units, an auto-started sync would race Sonarr/Radarr's startup and fail at
  # every bring-up. Naming the service on the command line enables the profile.
  configarr:
    image: ghcr.io/raydak-labs/configarr:1.30.2
    container_name: configarr
    # Not unless-stopped: a restart policy makes the daemon respawn a
    # run-to-completion container about once a minute.
    restart: "no"
    profiles:
      - configarr
    user: "${PUID:-1000}:${PGID:-10}"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      # Configarr otherwise exits 0 even when an instance fails; these turn a
      # silent partial failure into a non-zero exit ofelia reports as a failed job.
      STOP_ON_ERROR: "true"
      CONFIGARR_ENFORCE_CONFIG_VALIDATION: "true"
      # Arrive via extra --env-file flags (sonarr.env / radarr.env) — the
      # reasoning is in configarr.env.example. Read by !env in config.yml.
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is unset — run nas install to generate it}
      RADARR_API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is unset — run nas install to generate it}
    volumes:
      - ${CONFIGARR_CONFIG_DIR:-/volume2/docker/configarr/config}:/app/config
      - ${CONFIGARR_REPOS_DIR:-/volume2/docker/configarr/repos}:/app/repos
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  nas-net:
    name: nas-net
    external: true
