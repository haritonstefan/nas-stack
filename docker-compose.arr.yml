services:
  sonarr:
    image: linuxserver/sonarr:4.0.19.2979-ls321
    container_name: sonarr
    restart: unless-stopped
    # LinuxServer.io images take identity as environment and usermod internally,
    # unlike Homepage and Jellyfin which set `user:`. Neither touches the docker
    # socket, so an inspectable identity is not needed here. See spec section 8.
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Europe/Bucharest}
      # Read at every start and never persisted to config.xml. Losing arr.env
      # mints a new key silently. See spec section 8.
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?SONARR_API_KEY is unset — run up.sh to generate it}
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__LOG__ANALYTICSENABLED: "False"
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ${SONARR_CONFIG_DIR:-/volume2/docker/sonarr/config}:/config
      - ${ARR_SERIES_DIR:-/volume1/Media/Series}:/media/series
      # Identical container path in sonarr, radarr and qbittorrent: qBittorrent
      # reports absolute paths, so a mismatch fails every import.
      - ${DOWNLOADS_DIR:-/volume2/docker/downloads}:/downloads
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=http://apollo.local:${SONARR_PORT:-8989}
      - homepage.description=TV series
      - homepage.widget.type=sonarr
      # href is resolved by the browser, widget.url by the Homepage container.
      - homepage.widget.url=http://sonarr:8989
      - homepage.widget.key=${SONARR_API_KEY:?SONARR_API_KEY is unset — run up.sh to generate it}
      - homepage.widget.enableQueue=true

  radarr:
    image: linuxserver/radarr:6.3.0.10514-ls313
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Europe/Bucharest}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?RADARR_API_KEY is unset — run up.sh to generate it}
      RADARR__AUTH__METHOD: Forms
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
      RADARR__LOG__ANALYTICSENABLED: "False"
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ${RADARR_CONFIG_DIR:-/volume2/docker/radarr/config}:/config
      - ${ARR_MOVIES_DIR:-/volume1/Media/Movies}:/media/movies
      - ${DOWNLOADS_DIR:-/volume2/docker/downloads}:/downloads
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=http://apollo.local:${RADARR_PORT:-7878}
      - homepage.description=Movies
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878
      - homepage.widget.key=${RADARR_API_KEY:?RADARR_API_KEY is unset — run up.sh to generate it}
      - homepage.widget.enableQueue=true

  prowlarr:
    image: linuxserver/prowlarr:2.5.2.5491-ls156
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Europe/Bucharest}
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?PROWLARR_API_KEY is unset — run up.sh to generate it}
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
      PROWLARR__LOG__ANALYTICSENABLED: "False"
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${PROWLARR_CONFIG_DIR:-/volume2/docker/prowlarr/config}:/config
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr.png
      - homepage.href=http://apollo.local:${PROWLARR_PORT:-9696}
      - homepage.description=Indexer manager
      - homepage.widget.type=prowlarr
      - homepage.widget.url=http://prowlarr:9696
      - homepage.widget.key=${PROWLARR_API_KEY:?PROWLARR_API_KEY is unset — run up.sh to generate it}

  qbittorrent:
    image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls472
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Europe/Bucharest}
      WEBUI_PORT: ${QBITTORRENT_PORT:-8080}
      TORRENTING_PORT: ${QBITTORRENT_TORRENT_PORT:-6881}
    ports:
      - "${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:${QBITTORRENT_TORRENT_PORT:-6881}"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:${QBITTORRENT_TORRENT_PORT:-6881}/udp"
    volumes:
      - ${QBITTORRENT_CONFIG_DIR:-/volume2/docker/qbittorrent/config}:/config
      - ${DOWNLOADS_DIR:-/volume2/docker/downloads}:/downloads
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=qBittorrent
      - homepage.icon=qbittorrent.png
      - homepage.href=http://apollo.local:${QBITTORRENT_PORT:-8080}
      - homepage.description=Torrent client
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=http://qbittorrent:${QBITTORRENT_PORT:-8080}
      - homepage.widget.username=${QBITTORRENT_USER:-admin}
      - homepage.widget.password=${QBITTORRENT_PASSWORD:?QBITTORRENT_PASSWORD is unset — run up.sh to generate it}

  # No published port and no homepage labels: internal-only, so a tile would be
  # a dead end. Registered as Prowlarr's indexer proxy by arr-bootstrap.sh;
  # Prowlarr calls it only when a Cloudflare challenge is detected on a tagged
  # indexer. Speaks the FlareSolverr /v1 API (GET-only — request.post is
  # accepted but treated as a GET; fine here, the CF-protected trackers all
  # search via GET). Image ships its own /health-based HEALTHCHECK.
  byparr:
    image: ghcr.io/thephaseless/byparr:v3.0.3
    container_name: byparr
    restart: unless-stopped
    # Firefox/Camoufox needs more than Docker's 64 MB /dev/shm default;
    # upstream's guidance is 512 MB.
    shm_size: 512mb
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Applies the TRaSH quality profiles and custom formats. Run to completion,
  # not a daemon: ofelia below starts it on a schedule, and arr-bootstrap.sh
  # runs the first sync at bring-up. No published port and no homepage labels,
  # for the same reason as byparr.
  #
  # `profiles:` keeps it out of a plain `up -d`. This stack has no depends_on,
  # so an auto-started sync would race Sonarr and Radarr's startup and, with
  # STOP_ON_ERROR set, fail at every bring-up. Naming the service explicitly on
  # the command line enables its profile, so no --profile flag is needed.
  # up.sh creates the container with `up -d --no-start configarr`, which is what
  # gives ofelia something to start; ad-hoc runs pass their own --name.
  configarr:
    image: ghcr.io/raydak-labs/configarr:1.30.2
    container_name: configarr
    # Not unless-stopped: a restart policy makes the daemon respawn a
    # run-to-completion container about once a minute.
    restart: "no"
    profiles:
      - configarr
    user: "${PUID:-1000}:${PGID:-10}"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      # Configarr otherwise exits 0 even when an instance fails: the per-instance
      # error is counted and the run continues. Both of these turn a silent
      # partial failure into a non-zero exit that ofelia reports as a failed job.
      STOP_ON_ERROR: "true"
      CONFIGARR_ENFORCE_CONFIG_VALIDATION: "true"
      # Read by !env in config.yml. URLs are not passed: they are hardcoded to
      # container addresses there, because SONARR_URL/RADARR_URL in arr.env are
      # host addresses meant for the bootstrap's own curl calls.
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is unset — run up.sh to generate it}
      RADARR_API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is unset — run up.sh to generate it}
    volumes:
      - ${CONFIGARR_CONFIG_DIR:-/volume2/docker/configarr/config}:/app/config
      - ${CONFIGARR_REPOS_DIR:-/volume2/docker/configarr/repos}:/app/repos
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Starts the configarr container on a schedule. Configarr has no built-in
  # scheduler and upstream will not add one, so the cadence lives here.
  #
  # Needs the docker socket, which is root-equivalent host access — the second
  # container here to get it, after Homepage. Identity is set the same way:
  # a primary GID matching the socket's group, which survives a privilege drop
  # and needs no DAC_OVERRIDE. :ro restricts nothing about the API.
  ofelia:
    image: mcuadros/ofelia:0.3.22
    container_name: ofelia
    restart: unless-stopped
    user: "${PUID:-1000}:${DOCKER_GID:-121}"
    command: daemon --config=/etc/ofelia/config.ini
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OFELIA_CONFIG_DIR:-/volume2/docker/ofelia/config}/ofelia.ini:/etc/ofelia/config.ini:ro
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  nas-net:
    name: nas-net
    external: true
