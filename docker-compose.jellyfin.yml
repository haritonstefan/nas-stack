services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-10}"
    group_add:
      - "${RENDER_GID:-105}"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-/volume2/docker/jellyfin/config}:/config
      - ${JELLYFIN_CACHE_DIR:-/volume2/docker/jellyfin/cache}:/cache
      - ${MEDIA_MOVIES_DIR:-/volume1/Media/Movies}:/media/movies:ro
      - ${MEDIA_SERIES_DIR:-/volume1/Media/Series}:/media/series:ro
      - ${MEDIA_MUSIC_DIR:-/volume1/Media/Music}:/media/music:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "${JELLYFIN_HTTP_PORT:-8096}:8096"
      - "${JELLYFIN_DISCOVERY_PORT:-7359}:7359/udp"
      - "${JELLYFIN_DLNA_PORT:-1900}:1900/udp"
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=PathPrefix(`/jellyfin`)
      - traefik.http.routers.jellyfin.entrypoints=web
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=http://apollo.local/jellyfin
      - homepage.description=Media server

networks:
  nas-net:
    external: true
