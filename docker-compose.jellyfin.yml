services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    # Required for SSDP/broadcast discovery; `ports:` does not apply and must
    # never be added. See spec section 5.
    network_mode: host
    user: "${PUID:-1000}:${PGID:-10}"
    group_add:
      - "${RENDER_GID:-105}"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-/volume2/docker/jellyfin/config}:/config
      - ${JELLYFIN_CACHE_DIR:-/volume2/docker/jellyfin/cache}:/cache
      - ${MEDIA_MOVIES_DIR:-/volume1/Media/Movies}:/media/movies:ro
      - ${MEDIA_SERIES_DIR:-/volume1/Media/Series}:/media/series:ro
      - ${MEDIA_MUSIC_DIR:-/volume1/Media/Music}:/media/music:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=http://apollo.local:8096
      - homepage.description=Media server
      # widget urls are fetched by the Homepage container, so they use the host
      # LAN IP: Jellyfin is host-networked and off nas-net, and neither
      # container names nor .local resolve from inside a container.
      # JELLYFIN_API_KEY and JELLYFIN_SCAN_TASK_ID are minted by
      # jellyfin-bootstrap.sh (not up.sh), so they are legitimately empty on
      # the first bring-up — up.sh recreates this container once the bootstrap
      # has written them, because labels are baked in at container create.
      - homepage.widgets[0].type=jellyfin
      - homepage.widgets[0].url=http://${JELLYFIN_LAN_HOST:-192.168.0.231}:8096
      - homepage.widgets[0].key=${JELLYFIN_API_KEY:-}
      - homepage.widgets[0].enableBlocks=true
      - homepage.widgets[0].enableUser=true
      - homepage.widgets[0].showEpisodeNumber=true
      # Library-scan status (Idle/Running) — the jellyfin widget has no such
      # field, so it is read straight off the scheduled task.
      - homepage.widgets[1].type=customapi
      - homepage.widgets[1].url=http://${JELLYFIN_LAN_HOST:-192.168.0.231}:8096/ScheduledTasks/${JELLYFIN_SCAN_TASK_ID:-}
      - homepage.widgets[1].headers.X-Emby-Token=${JELLYFIN_API_KEY:-}
      - homepage.widgets[1].mappings[0].field=State
      - homepage.widgets[1].mappings[0].label=Library scan
