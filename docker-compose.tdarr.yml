services:
  # Server + internal node in one container. The libraries and flows live in
  # Tdarr's own database (/app/server), set up in its web UI — nothing here
  # seeds them. See spec section 8, Tdarr.
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.93.01
    container_name: tdarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-10}
      # Tdarr's name for it, not UMASK.
      UMASK_SET: ${UMASK:-002}
      TZ: ${TZ:-Europe/Bucharest}
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      inContainer: "true"
      internalNode: "true"
      nodeName: apollo
      ffmpegVersion: "7"
      # One worker: each job rewrites a whole file on the HDD, and two in
      # parallel only make the disk seek between them. Remuxing needs no GPU,
      # which is also why /dev/dri is not passed through.
      transcodecpuWorkers: "1"
      transcodegpuWorkers: "0"
      maxLogSizeMB: "10"
      # Read by tdarr-plugins/ to look up each file's original language. The
      # keys come from sonarr.env/radarr.env (see units/tdarr.sh), never a copy.
      # The URLs are literal: SONARR_URL/RADARR_URL in those files are the
      # host-side addresses the bootstrap uses, wrong from inside a container.
      TDARR_RADARR_URL: http://radarr:7878
      TDARR_SONARR_URL: http://sonarr:8989
      RADARR_API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is unset — run nas install to generate it}
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is unset — run nas install to generate it}
      TDARR_SUBTITLE_LANGS: ${TDARR_SUBTITLE_LANGS:-eng,rum}
    # 8266 (server port) stays unpublished: it exists for external nodes, and
    # the internal node reaches the server inside the container.
    ports:
      - "${TDARR_WEBUI_PORT:-8265}:8265"
    volumes:
      - ${TDARR_DATA_DIR:-/volume2/docker/tdarr}/server:/app/server
      - ${TDARR_DATA_DIR:-/volume2/docker/tdarr}/configs:/app/configs
      - ${TDARR_DATA_DIR:-/volume2/docker/tdarr}/logs:/app/logs
      # Repo-owned: read-only so the repo stays the only place the plugin
      # changes, and a git pull reaches it without a reinstall.
      - ./tdarr-plugins:/app/server/Tdarr/Plugins/Local:ro
      # Scratch for the rewritten file before it replaces the original. On the
      # SSD so the HDD only reads the source and writes the result once; needs
      # free space for the largest file being processed.
      - ${TDARR_DATA_DIR:-/volume2/docker/tdarr}/cache:/temp
      # Read-write: Tdarr replaces the original file in place. The download
      # tree is deliberately not mounted, so a seeding torrent can never be
      # touched — imports are copies (spec section 6). The container paths
      # must stay identical to radarr's and sonarr's: the plugin matches a
      # file to its movie/series by path prefix.
      - ${TDARR_MOVIES_DIR:-/volume1/Media/Movies}:/media/movies
      - ${TDARR_SERIES_DIR:-/volume1/Media/Series}:/media/series
    networks:
      - nas-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - homepage.group=Media
      - homepage.name=Tdarr
      - homepage.icon=tdarr.png
      - homepage.href=http://apollo.local:${TDARR_WEBUI_PORT:-8265}
      - homepage.description=Track cleanup
      - homepage.siteMonitor=http://tdarr:8265
      - homepage.widget.type=tdarr
      - homepage.widget.url=http://tdarr:8265

networks:
  nas-net:
    name: nas-net
    external: true
