# Services Homepage cannot auto-discover from Docker labels — anything that is
# not a container on this host. Containers should NOT be listed here; give them
# `homepage.*` labels in their own compose file instead, so the tile lives with
# the service definition.
#
# Copied to the Homepage config dir by up.sh only if not already present, so
# local edits survive. Edit it there, not here, once running.

- NAS:
    - UGOS:
        icon: ugreen.png
        href: http://apollo.local:9999
        description: NAS administration
        # Fetched by the Homepage container — apollo.local does not resolve there.
        siteMonitor: http://192.168.0.231:9999

# The Upcoming tile is not a container either — it aggregates the release
# calendars of the Sonarr and Radarr widgets that already exist via docker
# labels. integrations reference them by group+name; no url or key here.
- Media:
    - Upcoming:
        icon: mdi-calendar-month
        description: Release calendar
        widget:
          type: calendar
          view: agenda
          maxEvents: 12
          showTime: true
          integrations:
            - type: sonarr
              service_group: Media
              service_name: Sonarr
            - type: radarr
              service_group: Media
              service_name: Radarr
