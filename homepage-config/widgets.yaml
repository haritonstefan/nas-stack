# Header widgets (top of the dashboard). Installed by up.sh only when absent,
# so on-NAS edits survive — edit it there, not here, once running.
#
# Disk paths are CONTAINER paths — /volume1 and /volume2 are bind-mounted :ro
# into the homepage container for exactly this widget (docker-compose.core.yml).

- search:
    provider: duckduckgo
    target: _blank

- resources:
    label: system
    cpu: true
    memory: true
    uptime: true
    # May render blank in a container (reads /sys hwmon) — delete if so.
    cputemp: true
    units: metric

- resources:
    label: storage
    disk:
      - /volume1
      - /volume2

- openmeteo:
    label: Bucharest
    latitude: 44.4268
    longitude: 26.1025
    timezone: Europe/Bucharest
    units: metric
    cache: 5

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
      hourCycle: h23
