; Ofelia — the scheduler for configarr, which has no built-in one and never
; will (upstream considers scheduling out of scope for the container).
;
; up.sh installs this into OFELIA_CONFIG_DIR only when absent, so on-NAS edits
; survive. It lives outside configarr's own config dir so nothing can mistake it
; for a configarr file.
;
; job-run with `container` set (and no `image`) starts an *existing* container
; by name, waits for it to exit, and captures its logs. It never creates one, so
; the container named below must already exist — up.sh creates it with
; `up -d --no-start configarr`. If it is missing, the job fails on inspect and
; the only trace is `docker logs ofelia`.
;
; Ofelia reports a non-zero exit as a failed job. Together with
; STOP_ON_ERROR=true on configarr, that is what makes a failed sync visible:
; configarr otherwise exits 0 even when an instance fails.

[job-run "configarr-sync"]
schedule = @daily
container = configarr
